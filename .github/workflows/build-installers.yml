# Builds unsigned apps from the current branch for personal use, without making a release:
# Folio-Portable.exe for Windows (it never updates itself, so it keeps this repository's changes) and
# Folio-mac.dmg for macOS. Start it from the Actions tab with "Run workflow", then download the files
# from the finished run's Artifacts. Nothing is published.
name: Build installers

on:
  workflow_dispatch:
  # Lets a pull request that changes this file prove that it still works.
  pull_request:
    paths: [".github/workflows/build-installers.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package Windows (portable)
        run: npx electron-builder --win portable --publish never
      - name: Packaged app starts (Windows)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release/win-unpacked/Folio.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Folio exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: folio-windows-portable
          if-no-files-found: error
          path: release/Folio-Portable.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --publish never
      - name: Packaged app starts (macOS)
        run: |
          release/mac-universal/Folio.app/Contents/MacOS/Folio > app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid"; then cat app.log; exit 1; fi
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: folio-macos
          if-no-files-found: error
          path: release/Folio-mac.dmg
